# 三七 · 个人网站 Nginx 配置
# 放到 /etc/nginx/conf.d/sanqi.conf，改掉 server_name 和 root 即可。
# 上传方式见 deploy/upload.ps1

server {
    listen 80;
    listen [::]:80;
    server_name sanqi.design www.sanqi.design;

    root /var/www/sanqi;
    index index.html;

    # 证书配好之后，把上面这段换成下面这行，强制跳 HTTPS
    # return 301 https://$host$request_uri;

    charset utf-8;

    # ---------- 压缩（国内带宽小，文本资源压到 1/4）----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---------- 缓存 ----------
    # 带指纹的静态资源长缓存；HTML 不缓存，改动立刻生效
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /404.html {
        internal;
    }

    # ---------- 路由 ----------
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # ---------- 安全头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 隐藏 Nginx 版本号
    server_tokens off;
}

# ============================================================
# HTTPS（用 Let's Encrypt 或云厂商免费证书）
# certbot 自动签发的话这段会自动生成，不用手写；
# 手动机翻时取消注释并换成你的证书路径。
# ============================================================
